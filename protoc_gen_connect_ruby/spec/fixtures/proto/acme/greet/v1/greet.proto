syntax = "proto3";

package acme.greet.v1;

import "google/protobuf/timestamp.proto";

// Greets people.
service GreetService {
  // Says hello.
  //
  // Returns a greeting.
  rpc Greet(GreetRequest) returns (GreetResponse) {}

  rpc GetGreeting(GreetRequest) returns (GreetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc Headers(GreetRequest) returns (GreetRequest.Nested) {}

  // Greets once per second.
  rpc GreetStream(GreetRequest) returns (stream GreetResponse) {}

  rpc GreetMany(stream GreetRequest) returns (GreetResponse) {}

  rpc Converse(stream GreetRequest) returns (stream GreetResponse) {}
}

message GreetRequest {
  string name = 1;
  Nested nested = 2;
  repeated string tags = 3;
  map<string, Nested> extras = 4;
  Mood mood = 5;
  google.protobuf.Timestamp at = 6;
  double weight = 7;

  message Nested {
    string value = 1;
    Nested child = 2;
  }
}

enum Mood {
  MOOD_UNSPECIFIED = 0;
  MOOD_HAPPY = 1;
}

message GreetResponse {
  string greeting = 1;
}
